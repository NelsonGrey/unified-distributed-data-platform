syntax = "proto3";

package uddp.native.v1;

option go_package = "github.com/marknelson/uddp/api/native/v1;nativev1";

// StateService implements the KV surface of TRD section 6 for a single
// partition, single-node deployment (delivery slice 1). Replication,
// epochs, and multi-partition batches are introduced in later slices.
service StateService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (MutationResponse);
  rpc Delete(DeleteRequest) returns (MutationResponse);
  rpc CompareAndSet(CompareAndSetRequest) returns (MutationResponse);
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID = 1;
  ERROR_CODE_UNAUTHORIZED = 2;
  ERROR_CODE_CONFLICT = 3;
  ERROR_CODE_THROTTLED = 4;
  ERROR_CODE_UNAVAILABLE = 5;
  ERROR_CODE_DEADLINE = 6;
  ERROR_CODE_UNSUPPORTED = 7;
  ERROR_CODE_INDETERMINATE = 8;
}

message GetRequest {
  string namespace_id = 1;
  bytes key = 2;
}

message GetResponse {
  bytes value = 1;
  uint64 version = 2;
  bool found = 3;
}

message PutRequest {
  string namespace_id = 1;
  bytes key = 2;
  bytes value = 3;
  int64 ttl_seconds = 4; // 0 = no expiry
  string idempotency_key = 5;
}

message DeleteRequest {
  string namespace_id = 1;
  bytes key = 2;
  string idempotency_key = 3;
}

message CompareAndSetRequest {
  string namespace_id = 1;
  bytes key = 2;
  bytes value = 3;
  uint64 expected_version = 4; // 0 = key must not exist
  int64 ttl_seconds = 5;
  string idempotency_key = 6;
}

message MutationResponse {
  string namespace_id = 1;
  uint32 partition_id = 2;
  uint64 epoch = 3;
  uint64 commit_position = 4;
  string durability_profile = 5;
  bool deduplicated = 6;
  uint64 version = 7;
}
